openapi: 3.0.3
info:
  title: Happy Food Auth API
  version: 1.0.0
  description: Authentication endpoints for Happy Food backend
servers:
  - url: http://localhost:4000
    description: Local server
tags:
  - name: Auth
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signin:
    post:
      tags: [Auth]
      summary: Sign in with email (initiates 2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login accepted (2FA code sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/test:
    post:
      tags: [Auth]
      summary: Test endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: test-ok

  /api/auth/validate/2fa:
    post:
      tags: [Auth]
      summary: Validate 2FA code and exchange temp token for access/refresh tokens
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Bearer temp token (format: "Bearer <tempToken>")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  example: '1234567'
      responses:
        '200':
          description: 2FA validated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: '2FA validation successful'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/token:
    post:
      tags: [Auth]
      summary: Exchange refresh token for a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Optionally provide the refresh token as a bearer token
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '400':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    post:
      tags: [Posts]
      summary: Create a new post with ingredients and steps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: string
                    example: a1b2c3d4
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Posts]
      summary: List posts (paginated)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'

  /api/posts/latest:
    get:
      tags: [Posts]
      summary: Get latest posts with optional details
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: details
          schema:
            type: boolean
            description: Include ingredients and steps when true
      responses:
        '200':
          description: Latest posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostDetail'

  /api/posts/{id}:
      /api/auth/user-info:
        post:
          tags: [Auth]
          summary: Validate credentials and return user info (no tokens)
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [email, password]
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 8
          responses:
            '200':
              description: Returns user info
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/User'
            '400':
              description: Missing email or password
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
            '401':
              description: Invalid credentials
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Error'
    get:
      tags: [Posts]
      summary: Get a single post by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: test@example.com
        displayName:
          type: string
          nullable: true
          example: John Doe

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        firstName:
          type: string
          maxLength: 100
          example: John
        lastName:
          type: string
          maxLength: 100
          example: Doe
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          minLength: 8
          example: password123

    SignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          minLength: 8
          example: password123

    LoginResponse:
      type: object
      properties:
        tempToken:
          type: string
          description: Temporary token used for 2FA validation
        message:
          type: string
          example: '2FA code already sent. Please check your email.'

    Error:
      type: object
      properties:
        message:
          type: string
          example: Invalid credentials

    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: field
              value:
                description: Provided input value
              msg:
                type: string
                example: Invalid value
              path:
                type: string
                example: email
              location:
                type: string
                example: body
    Ingredient:
      type: object
      properties:
        ingredient_id:
          type: integer
        item_order:
          type: integer
        ingredient_text:
          type: string

    Step:
      type: object
      properties:
        step_id:
          type: integer
        step_number:
          type: integer
        step_description:
          type: string
        image_url:
          type: string

    CreatePostRequest:
      type: object
      required: [userId, title]
      properties:
        userId:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        title:
          type: string
          example: My Pancakes
        description:
          type: string
        cookTime:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
        coverImageUrl:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'

    PostSummary:
      type: object
      properties:
        post_id:
          type: string
        user_id:
          type: string
        title:
          type: string
        description:
          type: string
        cook_time:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
        cover_image_url:
          type: string
        created_at:
          type: string
          format: date-time

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/Ingredient'
            steps:
              type: array
              items:
                $ref: '#/components/schemas/Step'

