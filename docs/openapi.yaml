components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        email:
          type: string
          format: email

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SignupResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: require2FA
        message:
          type: string
          example: 2FA code sent to email
        twoFactorToken:
          type: string
          description: Temporary token required for /validate/2fa

    Validate2FARequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: '123456'

    Validate2FAResponse:
      type: object
      properties:
        message:
          type: string
          example: 2FA validation successful
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    TokenRefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AccessTokenValidationResponse:
      type: object
      properties:
        message:
          type: string
          example: Access token is valid
        user:
          type: object
          properties:
            userId:
              type: string
            username:
              type: string
              nullable: true

    UserInfo:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            profileImageUrl:
              type: string
              nullable: true
            isVerified:
              type: boolean

    IngredientInput:
      type: object
      properties:
        itemOrder:
          type: integer
        ingredientText:
          type: string

    StepInput:
      type: object
      properties:
        stepNumber:
          type: integer
        stepDescription:
          type: string
        imageUrl:
          type: string

    CreatePostRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        cookTime:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
        coverImageUrl:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientInput'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepInput'

    CreatePostMultipartRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Post title
        description:
          type: string
          description: Post description
        cookTime:
          type: integer
          description: Cooking time in minutes
        servings:
          type: integer
          description: Number of servings
        difficulty:
          type: string
          enum: [easy, medium, hard]
          description: Difficulty level
        coverImage:
          type: string
          format: binary
          description: Cover image file (multipart upload)
        ingredients:
          type: string
          description: JSON stringified array of ingredients
        steps:
          type: string
          description: JSON stringified array of recipe steps
        stepImages:
          type: array
          items:
            type: string
            format: binary
          description: Step image files (multipart upload)

    CreatePostResponse:
      type: object
      properties:
        postId:
          type: string
          example: a1b2c3d4

    PostSummary:
      type: object
      properties:
        postId:
          type: string
        userId:
          type: string
        title:
          type: string
        description:
          type: string
        cookTime:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
        coverImageUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    PostFeedItem:
      type: object
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          nullable: true
        reactions:
          type: object
          properties:
            like:
              type: integer
            heart:
              type: integer
            yum:
              type: integer
        userActions:
          type: object
          properties:
            userBookmark:
              type: boolean
            userReaction:
              type: string
              nullable: true

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/IngredientInput'
            steps:
              type: array
              items:
                $ref: '#/components/schemas/StepInput'

    PostWithActions:
      allOf:
        - type: object
          properties:
            postId:
              type: string
            title:
              type: string
            coverImgUrl:
              type: string
              nullable: true
            authorId:
              type: string
            authorName:
              type: string
              nullable: true
            cookTime:
              type: integer
              nullable: true
            servings:
              type: integer
              nullable: true
            difficulty:
              type: string
              nullable: true
            reactions:
              type: object
              properties:
                like:
                  type: integer
                heart:
                  type: integer
                yum:
                  type: integer
            userActions:
              type: object
              properties:
                userBookmark:
                  type: boolean
                userReaction:
                  type: string
                  nullable: true
            description:
              type: string
              nullable: true
            steps:
              type: array
              items:
                $ref: '#/components/schemas/StepInput'

    Comment:
      type: object
      properties:
        commentId:
          type: string
        postId:
          type: string
        userId:
          type: string
        userName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        parentCommentID:
          type: string
          nullable: true
        replyCount:
          type: integer

    CommentsPage:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    UserActionRequest:
      type: object
      required: [action, postId]
      properties:
        action:
          type: string
          enum: [reaction, bookmark]
        postId:
          type: string
        newReaction:
          type: string
          nullable: true
          description: like, heart, yum, or null to remove reaction
          enum: [like, heart, yum, null]
        newBookmark:
          type: boolean
          description: true to add bookmark, false to remove

    Bookmark:
      type: object
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
          example: Invalid request

    PostStructure:
      type: object
      description: Unified post structure with per-type reactions and viewer-specific actions
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorID:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          enum: [easy, medium, hard]
          nullable: true
        reactions:
          type: object
          description: Per-type reaction counts
          properties:
            like:
              type: integer
            heart:
              type: integer
            yum:
              type: integer
        userActions:
          type: object
          description: Viewer-specific actions (requires authentication)
          properties:
            userReaction:
              type: string
              nullable: true
              enum: [like, heart, yum, null]
              description: User's reaction type or null if no reaction
            userBookmark:
              type: boolean
              description: Whether the user has bookmarked this post

    EditProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000

    UserActionStatusResponse:
      type: object
      description: Response containing user's reaction and bookmark status for a post
      properties:
        postId:
          type: string
          description: The post ID
        reactions:
          type: object
          description: Count of each reaction type for the post
          properties:
            like:
              type: integer
              description: Number of like reactions
            heart:
              type: integer
              description: Number of heart reactions
            yum:
              type: integer
              description: Number of yum reactions
        userActions:
          type: object
          properties:
            userReaction:
              type: string
              nullable: true
              enum: [like, heart, yum, null]
              description: User's reaction type (like, heart, yum) or null if no reaction
            userBookmark:
              type: boolean
              description: Whether the user has bookmarked this post

    ProfileResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
