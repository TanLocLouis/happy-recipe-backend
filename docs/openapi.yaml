openapi: 3.0.3
info:
  title: Happy Food API
  version: 1.2.0
  description: Auth, posts, bookmarks, reactions, comments, profile management, and search for Happy Food backend
servers:
  - url: http://localhost:4000
    description: Local server

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Posts
  - name: Comments
  - name: UserActions
  - name: Profile
  - name: Search

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signin:
    post:
      tags: [Auth]
      summary: Start login and send 2FA code via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/2fa:
    post:
      tags: [Auth]
      summary: Validate 2FA code and exchange for access/refresh tokens
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Bearer twoFactorToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validate2FARequest'
      responses:
        '200':
          description: 2FA validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validate2FAResponse'
        '401':
          description: Invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/refresh-token:
    post:
      tags: [Auth]
      summary: Exchange refresh token for a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Optionally provide the refresh token as Bearer
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/access-token:
    get:
      tags: [Auth]
      summary: Validate an access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenValidationResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/user-info:
    get:
      tags: [Auth]
      summary: Get profile for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    post:
      tags: [Posts]
      summary: Create a new post with ingredients and steps
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePostResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Posts]
      summary: List posts (paginated)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'

  /api/posts/discover:
    get:
      tags: [Posts]
      summary: Feed with reactions and bookmark flags
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Post feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  postList:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostFeedItem'

  /api/posts/latest:
    get:
      tags: [Posts]
      summary: Latest posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: details
          schema:
            type: boolean
            description: When true, include ingredients and steps
      responses:
        '200':
          description: Latest posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostDetail'

  /api/posts/{id}:
    get:
      tags: [Posts]
      summary: Get a single post by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/PostWithActions'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}/comments:
    get:
      tags: [Comments]
      summary: Paginated comments for a post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Comments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsPage'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-action/user-action:
    post:
      tags: [UserActions]
      summary: Add/update reaction or bookmark for a post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionRequest'
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-action/bookmarks:
    get:
      tags: [UserActions]
      summary: List bookmarks for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookmarked posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profile/{userId}/bookmarks:
    get:
      tags: [Profile]
      summary: List bookmarked posts for a user (paginated)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID to get bookmarks for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Bookmarked posts with reactions and user actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarkedPosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'

  /api/profile/{userId}/posts:
    get:
      tags: [Profile]
      summary: List posts created by a user (paginated)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID to get posts for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: User's posts with reactions and viewer-specific actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  userPosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'

  /api/profile/edit:
    post:
      tags: [Profile]
      summary: Update user profile (display name and bio)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: No changes provided or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/search:
    get:
      tags: [Search]
      summary: Search posts by title (case-insensitive)
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            maxLength: 255
          description: Search query string
      responses:
        '200':
          description: Search results with reactions and viewer-specific actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  searchResults:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'
        '400':
          description: Missing or invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        email:
          type: string
          format: email

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    SignupResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            userId:
              type: string
            email:
              type: string
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        status:
          type: string
          example: require2FA
        message:
          type: string
          example: 2FA code sent to email
        twoFactorToken:
          type: string
          description: Temporary token required for /validate/2fa

    Validate2FARequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: '123456'

    Validate2FAResponse:
      type: object
      properties:
        message:
          type: string
          example: 2FA validation successful
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    TokenRefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AccessTokenValidationResponse:
      type: object
      properties:
        message:
          type: string
          example: Access token is valid
        user:
          type: object
          properties:
            userId:
              type: string
            username:
              type: string
              nullable: true

    UserInfo:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            bio:
              type: string
              nullable: true
            profileImageUrl:
              type: string
              nullable: true
            isVerified:
              type: boolean

    IngredientInput:
      type: object
      properties:
        itemOrder:
          type: integer
        ingredientText:
          type: string

    StepInput:
      type: object
      properties:
        stepNumber:
          type: integer
        stepDescription:
          type: string
        imageUrl:
          type: string

    CreatePostRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        cookTime:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard]
        coverImageUrl:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/IngredientInput'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepInput'

    CreatePostResponse:
      type: object
      properties:
        postId:
          type: string
          example: a1b2c3d4

    PostSummary:
      type: object
      properties:
        postId:
          type: string
        userId:
          type: string
        title:
          type: string
        description:
          type: string
        cookTime:
          type: integer
        servings:
          type: integer
        difficulty:
          type: string
        coverImageUrl:
          type: string
        createdAt:
          type: string
          format: date-time

    PostFeedItem:
      type: object
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          nullable: true
        reactions:
          type: object
          properties:
            like:
              type: integer
            heart:
              type: integer
            yum:
              type: integer
        userActions:
          type: object
          properties:
            userBookmark:
              type: boolean
            userReaction:
              type: string
              nullable: true

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: '#/components/schemas/IngredientInput'
            steps:
              type: array
              items:
                $ref: '#/components/schemas/StepInput'

    PostWithActions:
      allOf:
        - type: object
          properties:
            postId:
              type: string
            title:
              type: string
            coverImgUrl:
              type: string
              nullable: true
            authorId:
              type: string
            authorName:
              type: string
              nullable: true
            cookTime:
              type: integer
              nullable: true
            servings:
              type: integer
              nullable: true
            difficulty:
              type: string
              nullable: true
            reactions:
              type: object
              properties:
                like:
                  type: integer
                heart:
                  type: integer
                yum:
                  type: integer
            userActions:
              type: object
              properties:
                userBookmark:
                  type: boolean
                userReaction:
                  type: string
                  nullable: true
            description:
              type: string
              nullable: true
            steps:
              type: array
              items:
                $ref: '#/components/schemas/StepInput'

    Comment:
      type: object
      properties:
        commentId:
          type: string
        postId:
          type: string
        userId:
          type: string
        userName:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        parentCommentID:
          type: string
          nullable: true
        replyCount:
          type: integer

    CommentsPage:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    UserActionRequest:
      type: object
      required: [action, postId]
      properties:
        action:
          type: string
          enum: [reaction, bookmark]
        postId:
          type: string
        newReaction:
          type: string
          nullable: true
          description: like, heart, yum, or null to remove reaction
          enum: [like, heart, yum, null]
        newBookmark:
          type: boolean
          description: true to add bookmark, false to remove

    Bookmark:
      type: object
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorId:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
          example: Invalid request

    PostStructure:
      type: object
      description: Unified post structure with per-type reactions and viewer-specific actions
      properties:
        postId:
          type: string
        title:
          type: string
        coverImgUrl:
          type: string
          nullable: true
        authorID:
          type: string
        authorName:
          type: string
          nullable: true
        cookTime:
          type: integer
          nullable: true
        servings:
          type: integer
          nullable: true
        difficulty:
          type: string
          enum: [easy, medium, hard]
          nullable: true
        reactions:
          type: object
          description: Per-type reaction counts
          properties:
            like:
              type: integer
            heart:
              type: integer
            yum:
              type: integer
        userActions:
          type: object
          description: Viewer-specific actions (requires authentication)
          properties:
            userReaction:
              type: string
              nullable: true
              enum: [like, heart, yum, null]
              description: User's reaction type or null if no reaction
            userBookmark:
              type: boolean
              description: Whether the user has bookmarked this post

    EditProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 1000

    ProfileResponse:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
