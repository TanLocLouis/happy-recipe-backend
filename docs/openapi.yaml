openapi: 3.0.3
info:
  title: Happy Food API
  version: 1.5.0
  description: Auth, posts, bookmarks, reactions, comments, profile management, moderation, admin, search, users, and AI chat for Happy Food backend
servers:
  - url: http://localhost:4000
    description: Local server

security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Auth
  - name: Posts
  - name: Comments
  - name: UserActions
  - name: Profile
  - name: Users
  - name: Search
  - name: AI
  - name: Moderator
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/signin:
    post:
      tags: [Auth]
      summary: Start login and send 2FA code via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/2fa:
    post:
      tags: [Auth]
      summary: Validate 2FA code and exchange for access/refresh tokens
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Bearer twoFactorToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validate2FARequest'
      responses:
        '200':
          description: 2FA validated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validate2FAResponse'
        '401':
          description: Invalid 2FA code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/refresh-token:
    post:
      tags: [Auth]
      summary: Exchange refresh token for a new access token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
          description: Optionally provide the refresh token as Bearer
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/validate/access-token:
    get:
      tags: [Auth]
      summary: Validate an access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenValidationResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/user-info:
    get:
      tags: [Auth]
      summary: Get profile for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    post:
      tags: [Posts]
      summary: Create a new post with file uploads (multipart/form-data)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePostMultipartRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePostResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/json:
    post:
      tags: [Posts]
      summary: Create a new post with JSON payload (legacy endpoint)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePostResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/all:
    get:
      tags: [Posts]
      summary: List all posts (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'

  /api/posts/discover:
    get:
      tags: [Posts]
      summary: Feed with reactions and bookmark flags
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Post feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  postList:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostFeedItem'

  /api/posts/latest:
    get:
      tags: [Posts]
      summary: Latest posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: details
          schema:
            type: boolean
            description: When true, include ingredients and steps
      responses:
        '200':
          description: Latest posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostDetail'

  /api/posts/{id}:
    get:
      tags: [Posts]
      summary: Get a single post by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: '#/components/schemas/PostWithActions'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Posts]
      summary: Delete a post by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}/comments:
    get:
      tags: [Comments]
      summary: Paginated comments for a post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Comments page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsPage'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Comments]
      summary: Create a comment on a post
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-action/user-action:
    post:
      tags: [UserActions]
      summary: Add/update reaction or bookmark for a post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActionRequest'
      responses:
        '200':
          description: Action applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user-action/bookmarks:
    get:
      tags: [UserActions]
      summary: List bookmarks for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookmarked posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/related/{id}:
    get:
      tags: [Posts]
      summary: Get related posts by post ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Related posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostStructure'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}/user-action:
    get:
      tags: [Posts]
      summary: Get user's reaction and bookmark status for a specific post
      description: Returns the authenticated user's reaction type (like, heart, yum, or null) and bookmark status for a given post.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Post ID to get user action for
      responses:
        '200':
          description: User action status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserActionStatusResponse'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profile/{userId}/bookmarks:
    get:
      tags: [Profile]
      summary: List bookmarked posts for a user (paginated)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID to get bookmarks for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Bookmarked posts with reactions and user actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarkedPosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'

  /api/profile/{userId}/posts:
    get:
      tags: [Profile]
      summary: List posts created by a user (paginated)
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID to get posts for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: User's posts with reactions and viewer-specific actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  userPosts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'

  /api/profile/edit:
    post:
      tags: [Profile]
      summary: Update user profile (display name, bio, and avatar)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 100
                bio:
                  type: string
                  maxLength: 1000
                avatar:
                  type: string
                  format: binary
                  description: Profile avatar image file
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: No changes provided or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/search/results:
    get:
      tags: [Search]
      summary: Search users or posts with pagination
      parameters:
        - in: query
          name: category
          required: true
          schema:
            type: string
            enum: [user, post]
          description: Category to search in (user or post)
        - in: query
          name: query
          required: true
          schema:
            type: string
            maxLength: 255
          description: Search query string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
      responses:
        '200':
          description: Search results with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/PostStructure'
                        - $ref: '#/components/schemas/UserInfo'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      pageSize:
                        type: integer
                      hasMore:
                        type: boolean
        '400':
          description: Missing or invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{user_id}:
    get:
      tags: [Users]
      summary: Get user profile information by user ID
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
          description: User ID to retrieve profile for
      responses:
        '200':
          description: User profile information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          description: Missing userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/posts/{user_id}:
    get:
      tags: [Users]
      summary: Get posts by a specific user with pagination
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
          description: User ID to get posts for
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: User's posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostStructure'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer

  /api/users/notifications/list:
    get:
      tags: [Users]
      summary: Get user's notifications with pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: User notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        notificationId:
                          type: string
                        userId:
                          type: string
                        type:
                          type: string
                        content:
                          type: string
                        isRead:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/notifications/{notificationId}/read:
    patch:
      tags: [Users]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ai/chat:
    post:
      tags: [AI]
      summary: Chat with OpenAI assistant for recipe search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatList]
              properties:
                chatList:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                  description: Chat history (max 10 recent messages)
      responses:
        '200':
          description: AI response with recipe suggestions
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                  - type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Invalid request or chat history exceeds limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: AI service error or invalid response format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  raw:
                    type: string

  /api/ai/chat-gemini:
    post:
      tags: [AI]
      summary: Chat with Gemini assistant for recipe search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chatList]
              properties:
                chatList:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                  description: Chat history (max 10 recent messages)
      responses:
        '200':
          description: AI response with recipe suggestions
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      title:
                        type: string
                      description:
                        type: string
                      url:
                        type: string
                  - type: object
                    properties:
                      message:
                        type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: AI service error or invalid response format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  raw:
                    type: string

  /api/moderator/posts:
    get:
      tags: [Moderator]
      summary: Get all posts with filtering and pagination (Moderator only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: includeDeleted
          schema:
            type: boolean
            default: false
          description: Include soft-deleted posts
        - in: query
          name: userId
          schema:
            type: string
          description: Filter posts by user ID
        - in: query
          name: search
          schema:
            type: string
          description: Search in title and description
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not a moderator)
          content:
